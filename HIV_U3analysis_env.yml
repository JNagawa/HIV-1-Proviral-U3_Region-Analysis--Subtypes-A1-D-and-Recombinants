name: HIV_U3analysis
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # General Quality Assessment & Aggregation
  - fastqc
  - multiqc
  
  # Illumina QC & Trimming
  - fastp
  - trimmomatic
  - cutadapt

  # Nanopore & PacBio QC
  - nanoplot
  - nanoqc
  - nanostat
  - nanofilt
  - porechop_abi

  # Contamination Removal
  - kraken2         # needs a separate database download, not bundled by
                    # conda -- see data/reference/kraken2_standard_16gb_db/SOURCE.md.
                    # Was previously listed here but never actually invoked
                    # anywhere in the pipeline until this fix.

  # Sequence download and manipulation
  - sra-tools
  - seqkit

  # PacBio circular consensus sequence calling (proxy for SMRT Link CCS)
  - pbccs

  # Reference Mapping, Consensus Calling & Alignment (production pipeline steps 7/9/11)
  - bwa
  - minimap2
  - samtools
  - bcftools>=1.20  # unpinned resolved to bcftools 1.6 (2017), built against an
                    # ancient OpenSSL 1.0.0 not present in this env -- it failed
                    # at runtime with "libcrypto.so.1.0.0: cannot open shared
                    # object file", silently, since the pipeline's bcftools calls
                    # were piped through 2>/dev/null. Pin forces a modern,
                    # mutually-compatible resolution (confirmed: bcftools 1.24).
  - htslib
  - mafft
  - bc              # SHIVER's shiver_funcs.sh uses `bc` to validate float config
                    # values (MaxContigGappiness/MinContigHitFrac) in
                    # shiver_init.sh. The compute nodes' image has no `bc`
                    # (only the login node does), so without this SHIVER quits
                    # at init with "bc: command not found" -- the blocker hit
                    # after the LANL reference-alignment one was resolved.

  # tool_comparison/ only -- not used by the production pipelines directly
  - spades=3.15.5   # unpinned resolves to 4.3.0, whose spades-hammer binary
                    # crashes with SIGILL ("OS return value: -4") on this
                    # node's CPU (AVX+SSE4.2, no AVX2/FMA). 3.15.5 (last
                    # pre-4.x release, predates its k-mer-counting rewrite)
                    # confirmed to run to completion on this hardware.
  - muscle=3.8*     # unpinned resolves to 5.3, which crashes with SIGILL
                    # ("Illegal instruction", exit 132) on this node's CPU
                    # for the same AVX2/FMA reason as spades above. Classic
                    # MUSCLE 3.8 has no AVX2 requirement.
  - clustalo
  - hifiasm         # PacBio arm: de novo HiFi assembler, compared against
                    # minimap2->HXB2 + bcftools-consensus in
                    # scripts/assembly/pacbio/compare_assembly_pacbio.sh. The
                    # tools review names no long-read de novo assembler, so
                    # hifiasm (the standard for PacBio HiFi) is the de novo
                    # counterpart to SHIVER/SPAdes on the Illumina arm.
  - chopper         # PacBio arm: fast Rust long-read length/quality filter,
                    # compared against NanoFilt (legacy) and fastp in
                    # scripts/download_qc/pacbio/download_qc_pacbio.sh. Scripts
                    # skip it gracefully if the solver can't place it.
  - iqtree=2.*     # unpinned resolves to IQ-TREE 3.x (binary "iqtree"/"iqtree3",
                    # not "iqtree2"); the tools review specifically cites IQ-TREE 2,
                    # and run_iqtree.sh calls the "iqtree2" binary name that this
                    # 2.x series installs
  - meme          # provides fimo
  - blast         # picking the best SPAdes contig by similarity to HXB2
  - moods         # confirmed on bioconda (package "moods", Python module MOODS)
  - bioconductor-tfbstools
  - bioconductor-pqsfinder
  # gquad (G-quadruplex prediction) is CRAN-only, not on any conda channel
  # (confirmed by direct search) -- install separately after this env is
  # created: Rscript -e 'install.packages("gquad", repos="https://cloud.r-project.org")'
